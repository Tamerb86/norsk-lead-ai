version: 2.1

jobs:
  check-and-test:
    docker:
      - image: cimg/node:22.13
        environment:
          VITE_APP_ID: test-app
          JWT_SECRET: ci-only-jwt-secret-not-used-in-real-environments
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      - image: cimg/postgres:16.4
        environment:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
    steps:
      - checkout
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm@10
      - restore_cache:
          keys:
            - pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-deps-v1-
      - run:
          name: Install dependencies
          command: pnpm install --frozen-lockfile
      - save_cache:
          key: pnpm-deps-v1-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.local/share/pnpm/store
      - run:
          name: TypeScript check
          command: pnpm run check
      - run:
          name: Wait for Postgres
          command: |
            for i in $(seq 1 30); do
              pg_isready -h localhost -p 5432 -U test && break
              sleep 1
            done
      - run:
          name: Apply migrations
          command: npx drizzle-kit migrate
      - run:
          name: Seed test user
          command: node .circleci/seed-test-user.cjs
      - run:
          name: Unit tests
          command: pnpm test
      - run:
          name: Build
          command: pnpm run build

workflows:
  ci:
    jobs:
      - check-and-test
