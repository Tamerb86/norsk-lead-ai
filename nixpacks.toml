[phases.setup]
nixPkgs = ["nodejs_22", "nodePackages.pnpm"]

[phases.install]
cmds = ["npm install -g pnpm", "pnpm install"]

[phases.build]
cmds = ["pnpm run build"]

[start]
# Apply pending DB migrations before boot (baseline is idempotent, so this
# is safe on databases that already have the schema).
cmd = "npx drizzle-kit migrate && pnpm run start"
